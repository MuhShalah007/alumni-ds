<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo Buku Alumni Darusy Syahadah">
  <title>Buku Alumni — Pondok Pesantren Islam Darusy Syahadah</title>
  <!-- Green rounded square background -->
  <rect width="100" height="100" rx="22" fill="#087348"/>

  <!-- Hilal (crescent) — Islamic identity -->
  <circle cx="50" cy="9" r="3" fill="#ffffff"/>
  <circle cx="51.6" cy="8.2" r="2.4" fill="#087348"/>

  <!-- Dome finial -->
  <circle cx="50" cy="14.5" r="2" fill="#ffffff"/>
  <rect x="49.25" y="16" width="1.5" height="5" fill="#ffffff"/>

  <!-- Onion dome silhouette -->
  <path d="M 34 58 C 34 50 27 43 31 33 C 35 25 42 21 50 21 C 58 21 65 25 69 33 C 73 43 66 50 66 58 Z" fill="#ffffff"/>

  <!-- Open book: two pages spreading from center spine -->
  <path d="M 50 64 C 44 62 34 62 26 66 L 26 84 C 34 82 44 82 50 86 Z" fill="#ffffff"/>
  <path d="M 50 64 C 56 62 66 62 74 66 L 74 84 C 66 82 56 82 50 86 Z" fill="#ffffff"/>

  <!-- Spine valley -->
  <path d="M 50 64 L 50 86" stroke="#087348" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Page lines (left) -->
  <path d="M 31 70 C 37 68.5 43 68.5 47 70.5" stroke="#087348" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 31 75 C 37 73.5 43 73.5 47 75.5" stroke="#087348" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Page lines (right) -->
  <path d="M 53 70.5 C 57 68.5 63 68.5 69 70" stroke="#087348" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 53 75.5 C 57 73.5 63 73.5 69 75" stroke="#087348" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
